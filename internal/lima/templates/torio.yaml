# Torio product Lima template (embedded).
# The layout is the one a fresh-VM onboarding run on Lima 2.2.0 settled on: no
# host mounts, no persistent agent forwarding, no user or system containerd, and
# a dated Ubuntu 24.04 image release rather than a floating `/release/` URL, so
# two machines created weeks apart boot the same guest. Docker is absent on
# purpose — adding `hermes` to the docker group is root-equivalent and would
# void the VM boundary, so a container runtime for agents needs its own ADR.
# internal/lima.Init substitutes the operator user, cpus, memory, disk, the
# operator shell helper and the host-derived pins before limactl create. Their
# tokens are deliberately not spelled out here: substitution is a plain string
# replace over the whole file, so any occurrence — including one inside a
# comment or a guard — is rewritten.
#
# The hypervisor driver, guest architecture and image come from
# internal/lima.Profile, which is also what verifyCompatibleConfig checks the
# created instance against. Writing them here as literals would give the
# renderer and the verifier separate opinions about the same instance.
#
# No secrets. No broad host home/project mount. No rootful Docker for hermes.
minimumLimaVersion: "2.0.0"

vmType: __TORIO_VMTYPE__
arch: __TORIO_ARCH__

cpus: __TORIO_CPUS__
memory: __TORIO_MEMORY__
disk: __TORIO_DISK__

images:
  - location: "__TORIO_IMAGE_URL__"
    arch: __TORIO_ARCH__
    digest: "__TORIO_IMAGE_DIGEST__"
    variant: server

mounts: []

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -y
      apt-get install -y --no-install-recommends git curl ca-certificates xz-utils sudo uidmap dbus-user-session

      if ! getent group torio-projects >/dev/null; then
        groupadd --system torio-projects
      fi

      # The backend's own identity and layout. Substituted from the backend this
      # instance declares, so a guest is provisioned for exactly one agent: a
      # second agent identity inside torio-projects would widen who can read
      # every checkout, for a backend nothing on this box will ever run.
      #
      # Rootful Docker Engine is intentionally NOT installed for any backend. An
      # agent identity must not gain root-equivalent docker.sock access. Future
      # container use requires an agent-owned rootless runtime behind a separate
      # ADR (ADR-0003).
      __TORIO_BACKEND_PROVISION__

  # The guest entry point of `torio project shell` (internal/lima.OperatorShellHelper).
  # A data file rather than a script, so Lima owns the ownership and mode and
  # re-materializes the helper root-owned on every boot: the session it opens
  # carries the operator's forwarded SSH agent, so nothing the operator or hermes
  # can rewrite may sit on that path. Content is injected verbatim from
  # internal/lima/templates/torio-project-shell.sh.
  - mode: data
    path: __TORIO_PROJECT_SHELL_PATH__
    owner: "root:root"
    permissions: "0755"
    overwrite: true
    content: |
      __TORIO_PROJECT_SHELL__

  # Ordinary project terminal. It is separate from the operator shell helper
  # because its SSH transport explicitly disables agent forwarding.
  - mode: data
    path: __TORIO_PROJECT_ENTER_PATH__
    owner: "root:root"
    permissions: "0755"
    overwrite: true
    content: |
      __TORIO_PROJECT_ENTER__

  # Lima login user exists by the time user-mode provision runs.
  - mode: user
    script: |
      #!/bin/bash
      set -euxo pipefail
      OPERATOR_USER="__TORIO_OPERATOR_USER__"
      # Matched as a glob, never spelled out as the placeholder. The renderer
      # substitutes every occurrence of the exact token, so a guard that named
      # it compared the value against itself, fired on every correctly rendered
      # template, and left the operator out of torio-projects for good.
      case "${OPERATOR_USER}" in
        "" | __TORIO_*)
          echo "torio template: OPERATOR_USER placeholder not substituted" >&2
          exit 1
          ;;
      esac
      if [ "$(id -un)" != "${OPERATOR_USER}" ]; then
        echo "torio template: login identity $(id -un) != configured ${OPERATOR_USER}" >&2
        exit 1
      fi
      sudo -n usermod -aG torio-projects "${OPERATOR_USER}"
      id -nG "${OPERATOR_USER}" | tr ' ' '\n' | grep -qx torio-projects
