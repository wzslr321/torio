name: spike-003-linux-host-lima

# Throwaway. Answers one question: can a GitHub-hosted Linux runner boot the
# Torio guest under Lima's qemu driver, and at what cost? Every later step of
# Linux host support depends on the answer, so it is proved before anything is
# built on it.
#
# The pull_request trigger is scoped to this spike's own files. It fires once,
# when the spike lands for review, and never again unless the driver itself
# changes — so the verdict arrives attached to the pull request that asks for
# it. workflow_dispatch is there for re-runs after the file reaches main, which
# is the only branch GitHub will dispatch from.
#
# Both are deleted together with spikes/003-linux-host-lima/ once the verdict
# has moved into the ADR it changes.
on:
  pull_request:
    paths:
      - "spikes/003-linux-host-lima/**"
      - ".github/workflows/spike-linux-host-lima.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to execute on
        required: false
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  probe:
    name: Lima qemu guest on ${{ inputs.runner || 'ubuntu-24.04' }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record host capability before anything changes it
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf 'runner: %s\n' "${RUNNER_NAME:-unknown}"
          printf 'kernel: %s\n' "$(uname -a)"
          printf 'cpus: %s\n' "$(nproc)"
          free -h || true
          df -h / /mnt || true
          ls -l /dev/kvm || echo "no /dev/kvm"
          grep -c -E '^flags.*(vmx|svm)' /proc/cpuinfo || echo "no vmx/svm flag"

      - name: Probe
        timeout-minutes: 35
        env:
          SPIKE003_RUN_ID: ${{ github.run_id }}
          SPIKE003_EVIDENCE_DIR: ${{ runner.temp }}/spike003-evidence
        run: bash spikes/003-linux-host-lima/probe.sh

      - name: Upload evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike003-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spike003-evidence
          if-no-files-found: warn
          retention-days: 14
