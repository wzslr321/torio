name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (for dry-run / manual); must start with v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The two gates prove different things, so a release waits for both.
  #
  # Linux boots a real guest and runs the whole journey — the strongest evidence
  # available, and the same gate every pull request already passed.
  linux-e2e:
    name: verify on real Linux / KVM
    permissions:
      contents: read
    uses: ./.github/workflows/platform-e2e.yml
    with:
      checkout_ref: ${{ inputs.tag || github.ref }}
      runner: ubuntu-24.04
      stage: full

  # macOS proves the one thing Linux cannot: that the darwin/arm64 archive
  # installs and runs on darwin. Hosted macOS runners cannot boot a guest
  # (kern.hv_support is 0), so this is the host stage only. It bills at ten
  # times the Linux rate on a private repository, which is worth paying a
  # handful of times a year and was not worth paying per pull request.
  darwin-e2e:
    name: verify the darwin archive on real macOS arm64
    permissions:
      contents: read
    uses: ./.github/workflows/platform-e2e.yml
    with:
      checkout_ref: ${{ inputs.tag || github.ref }}
      runner: macos-15
      stage: host

  package:
    name: package every supported host
    needs: [linux-e2e, darwin-e2e]
    # Cross-compiled from a Linux runner; GOOS/GOARCH produce both binaries.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Resolve version
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${REQUESTED_TAG}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          case "$REF" in
            v*) VERSION="${REF#v}" ;;
            *) echo "tag must start with v, got: $REF" >&2; exit 1 ;;
          esac
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Validate before packaging
        run: |
          set -euo pipefail
          make validate
          make e2e
          go test ./...
          go vet ./...

      # One archive per supported host, into one dist/ with a single
      # SHA256SUMS covering both. The platform list lives in
      # scripts/package_release.py and is asserted against
      # internal/lima.profiles, so a host can never be shipped without pins or
      # pinned without being shipped.
      - name: Build and package every supported host
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in darwin/arm64 linux/amd64; do
            goos="${platform%%/*}"; goarch="${platform##*/}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
              -o "dist/torio-${goos}-${goarch}" ./cmd/torio
            python3 scripts/package_release.py \
              --version "${VERSION}" \
              --platform "${platform}" \
              --binary "dist/torio-${goos}-${goarch}" \
              --license LICENSE \
              --out dist
          done
          cat dist/SHA256SUMS

      # A manual dispatch validates, builds and packages without creating a tag
      # or a release — the publish step below is push-only. Without this the run
      # then throws the tarball away, which makes the dry run test a build
      # rather than an asset: `make package-release` builds natively on a Mac,
      # this job cross-compiles from Linux, and the cross-compiled bytes are
      # what a tester installs. Keep the retention short; these are not
      # published artifacts and must not read as a release.
      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torio-${{ steps.meta.outputs.version }}-dryrun
          path: |
            dist/torio_${{ steps.meta.outputs.version }}_darwin_arm64.tar.gz
            dist/torio_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Create release if missing; upload assets. Never runs on plain PRs.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            "dist/torio_${{ steps.meta.outputs.version }}_darwin_arm64.tar.gz" \
            "dist/torio_${{ steps.meta.outputs.version }}_linux_amd64.tar.gz" \
            dist/SHA256SUMS \
            --clobber
