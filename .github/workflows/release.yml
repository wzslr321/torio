# AI-Provenance:
#   model: Cursor Grok 4.5
#   harness: Cursor

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (for dry-run / manual); must start with v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  darwin-arm64:
    name: package darwin/arm64
    # Cross-compile from Linux runner; GOOS/GOARCH produce the macOS arm64 binary.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          case "$REF" in
            v*) VERSION="${REF#v}" ;;
            *) echo "tag must start with v, got: $REF" >&2; exit 1 ;;
          esac
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Validate before packaging
        run: |
          set -euo pipefail
          make validate
          go test ./...
          go vet ./...

      - name: Build darwin/arm64 binary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o dist/torio ./cmd/torio

      - name: Package release assets
        run: |
          set -euo pipefail
          python3 scripts/package_release.py \
            --version "${{ steps.meta.outputs.version }}" \
            --binary dist/torio \
            --license LICENSE \
            --out dist

      - name: Upload release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Create release if missing; upload assets. Never runs on plain PRs.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            "dist/torio_${{ steps.meta.outputs.version }}_darwin_arm64.tar.gz" \
            dist/SHA256SUMS \
            --clobber
