name: platform-e2e

# The real product journey: release tarball, install.sh, real limactl, a real
# guest.
#
# It runs on Linux by default, and that is the point. Hosted macOS runners are
# themselves VMs and report `kern.hv_support = 0`, so they can only ever run the
# `host` half — no automated job in this repository had ever booted a guest.
# Hosted Linux runners expose /dev/kvm, so the `guest` half becomes gateable for
# the first time, at a tenth of the macOS billing rate on a private repository.
# Spike 003 measured create 10s, boot 104s.
#
# macOS is still reachable, and the release workflow still uses it: it is the
# only way to prove the darwin/arm64 archive installs and runs on darwin. There
# it is worth ten times the rate a handful of times a year; on every pull
# request it was not.
on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to verify when called from another workflow
        required: false
        type: string
      stage:
        description: "host (no hypervisor needed) or full (boots a real VM)"
        required: false
        type: string
        default: full
      runner:
        description: Runner label to execute on
        required: false
        type: string
        default: ubuntu-24.04
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      stage:
        description: "host (no hypervisor needed) or full (boots a real VM)"
        required: false
        type: choice
        default: full
        options: [host, full]
      runner:
        description: Runner label to execute on
        required: false
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  # The runner and the stage are part of the group because the release workflow
  # calls this one twice in a single run — Linux for the guest journey, macOS
  # for the darwin host stage. In a reusable workflow the `github` context is
  # the caller's, so `github.workflow` and `github.ref` resolve to the same
  # strings for both calls; a group built from those alone would place the two
  # gates in one group and `cancel-in-progress` would have the second cancel the
  # first. `package` needs both, so the tag would publish nothing.
  #
  # A pull request still gets exactly one group per ref: it takes the defaults,
  # so a new push cancels the run it superseded, as before.
  group: platform-e2e-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner || 'ubuntu-24.04' }}-${{ inputs.stage || 'full' }}
  cancel-in-progress: true

jobs:
  platform:
    name: real ${{ inputs.runner || 'ubuntu-24.04' }} / Lima ${{ inputs.stage || 'full' }} stage
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (inputs.stage || 'full') == 'full' && 45 || 25 }}
    env:
      TORIO_INSTANCE: torio-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PLATFORM_E2E_STAGE: ${{ inputs.stage || 'full' }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
          check-latest: false

      # /dev/kvm exists on hosted Linux runners but is not writable as
      # delivered. Measured in spike 003, along with the rule that fixes it.
      #
      # The rule is applied *and* the mode is set directly, because `udevadm
      # trigger` is asynchronous: reading writability straight after it is a
      # race, and one that a first run happened to win. The rule is what
      # survives the device being re-created; the chmod is what makes this step
      # true by the time it exits.
      - name: Enable KVM
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "no /dev/kvm on this runner" >&2; exit 1; }
          printf 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"\n' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          if [ ! -w /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          test -w /dev/kvm || { echo "/dev/kvm still not writable" >&2; exit 1; }
          ls -l /dev/kvm
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf

      - name: Install verified Lima 2.2.0
        timeout-minutes: 5
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              archive_name="lima-2.2.0-Linux-x86_64.tar.gz"
              archive_sha="a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a"
              ;;
            macOS)
              archive_name="lima-2.2.0-Darwin-arm64.tar.gz"
              archive_sha="bbdef91774885a0d05f7b048c4eb89ae2bcf3a0c252ae7ca7934e63df76d93c3"
              ;;
            *) echo "unsupported runner OS ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          lima_root="${RUNNER_TEMP}/lima-2.2.0"
          archive="${RUNNER_TEMP}/${archive_name}"
          mkdir -p "${lima_root}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/lima-vm/lima/releases/download/v2.2.0/${archive_name}"
          # The two runner families ship different checksum tools.
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${archive_sha}" "${archive}" | sha256sum -c -
          else
            printf '%s  %s\n' "${archive_sha}" "${archive}" | shasum -a 256 -c -
          fi
          tar -xzf "${archive}" -C "${lima_root}"
          printf '%s/bin\n' "${lima_root}" >> "${GITHUB_PATH}"

      - name: Build and install release-shaped Torio
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Package only the host about to be installed on. Cross-building the
          # other platform here would prove nothing this job goes on to run.
          case "${RUNNER_OS}" in
            Linux) platform="linux/amd64" ;;
            macOS) platform="darwin/arm64" ;;
          esac
          make package-release VERSION=0.0.0 PLATFORMS="${platform}"
          bash scripts/install.sh \
            --version 0.0.0 \
            --base-url "${PWD}/dist" \
            --prefix "${RUNNER_TEMP}/torio-e2e-bin"

      - name: Run real product journey
        timeout-minutes: ${{ (inputs.stage || 'full') == 'full' && 30 || 15 }}
        env:
          PLATFORM_E2E_ARTIFACT_DIR: ${{ runner.temp }}/torio-platform-e2e-artifacts
          PLATFORM_E2E_EXPECTED_VERSION: 0.0.0
          PLATFORM_E2E_TORIO_BIN: ${{ runner.temp }}/torio-e2e-bin/torio
          # Diagnostics must read the Lima instance before anything deletes it,
          # so the two steps below own teardown instead of the suite.
          PLATFORM_E2E_EXTERNAL_CLEANUP: "1"
        run: |
          set -euo pipefail
          case "${PLATFORM_E2E_STAGE}" in
            host) export PLATFORM_E2E_LABEL_FILTER='!guest' ;;
            full) export PLATFORM_E2E_LABEL_FILTER='' ;;
            *) printf 'unknown stage %s\n' "${PLATFORM_E2E_STAGE}" >&2; exit 2 ;;
          esac
          make platform-e2e

      - name: Collect failure diagnostics
        if: failure() || cancelled()
        timeout-minutes: 3
        env:
          PLATFORM_E2E_ARTIFACT_DIR: ${{ runner.temp }}/torio-platform-e2e-artifacts
        run: bash e2e/platform/diagnostics.sh

      - name: Remove the E2E VM
        if: always()
        timeout-minutes: 5
        run: bash e2e/platform/cleanup.sh

      - name: Upload Ginkgo JUnit report
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-e2e-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/torio-platform-e2e-artifacts/ginkgo-junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/torio-platform-e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
