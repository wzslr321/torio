{{banner}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Resolve the saved theme before first paint so a reader who chose light
      // does not get a dark flash (or the reverse). Inline and tiny for that.
      (function () {
        try {
          var saved = localStorage.getItem("torio-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-page="{{page_id}}">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="index.html">
          <span class="mark" aria-hidden="true"></span>
          <strong>Torio</strong>
        </a>
        <div class="header-side">
          <nav class="site-nav" aria-label="Documentation sections">
            <ul>
              {{nav}}
            </ul>
          </nav>
          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch colour theme"
            title="Switch colour theme"
          >
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    {{scope_notice}}

    <main id="main">
      <div class="content">
        {{kicker}}{{content}}
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>
          Torio documentation. The source for every page on this site lives in
          the <a href="{{repo_url}}">torio</a>
          repository.
        </p>
      </div>
    </footer>

    <script src="docs.js" defer></script>
  </body>
</html>
